name: Fetch Encrypted Secrets

on:
  workflow_call:
    inputs:
      zip_url_json:
        required: true
        type: string

jobs:
  download-zip:
    runs-on: ubuntu-latest
    steps:
      - name: Download with Retry
        env:
          GENURL: ${{ secrets.GENURL }}
          RDGEN_API_TOKEN: ${{ secrets.RDGEN_API_TOKEN }}
          ZIP_URL_JSON: ${{ inputs.zip_url_json }}
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_wait_seconds: 15
          shell: python
          command: |
            import requests
            import json
            import time
            import os
            from urllib.parse import quote, urlsplit

            def origin(url):
                parsed = urlsplit(url)
                if parsed.scheme.lower() not in ("http", "https") or not parsed.hostname:
                    raise ValueError("Invalid RDGen URL")
                if parsed.username or parsed.password:
                    raise ValueError("Invalid RDGen URL")
                port = parsed.port or (443 if parsed.scheme.lower() == "https" else 80)
                return parsed.scheme.lower(), parsed.hostname.lower(), port

            configured_url = os.environ.get("GENURL", "").rstrip("/")
            api_token = os.environ.get("RDGEN_API_TOKEN", "")
            if not configured_url or not api_token:
                raise RuntimeError("RDGen download authentication is not configured")

            input_data = json.loads(os.environ["ZIP_URL_JSON"])
            if origin(input_data.get("url", "")) != origin(configured_url):
                raise ValueError("Encrypted ZIP URL origin does not match configured RDGen origin")
            filename = input_data.get("file")
            if not isinstance(filename, str) or not filename:
                raise ValueError("Encrypted ZIP filename is missing")
            url = f"{configured_url}/get_zip?filename={quote(filename, safe='')}"
            headers = {"Authorization": f"Bearer {api_token}"}
            
            for attempt in range(5):
                try:
                    print(f"Downloading (Attempt {attempt + 1})...")
                    r = requests.get(url, headers=headers, timeout=20, allow_redirects=False)
                    if r.is_redirect:
                        raise RuntimeError("Unexpected redirect from RDGen")
                    r.raise_for_status()
                    with open('secrets.zip', 'wb') as f:
                        f.write(r.content)
                    break
                except Exception as e:
                    if attempt < 4:
                        time.sleep(5 * (2 ** attempt))
                    else: raise e

      - name: Upload Encrypted Artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-secrets-zip
          path: secrets.zip
          retention-days: 1
